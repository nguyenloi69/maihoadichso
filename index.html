 function getCurrentDate() {
    const today = new Date();

    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');

    return `${year}-${month}-${day}`;
}

async function getNgayAmLich() {
	date = getCurrentDate();
   await fetch(`https://liu.com.vn/api/ngay/${date}`, {
        method: "GET",
        headers: {
            "Accept": "application/json"
        }
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("HTTP Error: " + response.status);
        }
        return response.json();
    })
    .then(data => {
        console.log("Dữ liệu API:", data);
		const today = new Date();

		const year = today.getFullYear();
		const month = String(today.getMonth() + 1).padStart(2, '0');
		const day = String(today.getDate()).padStart(2, '0');
		document.getElementById("duonglich").innerText = "Dương Lịch: " + `${day}/${month}/${year}`;
		document.getElementById("amlich").innerText = "Âm Lịch: " + data.am_lich.ngay + "/" + data.am_lich.thang + "/" + data.am_lich.nam  ;
		ngayAm = data.am_lich.ngay;
		thangAm = data.am_lich.thang;
		namAmCanChi = data.can_chi.nam;
        // Lấy thông tin
        console.log("Ngày âm:", data.ngay_am);
        console.log("Can chi ngày:", data.can_chi.ngay + " - " + namAmCanChi);
        console.log("Đánh giá:", data.danh_gia);
    })
    .catch(error => {
        console.error("Lỗi gọi API:", error);
    });
}

 async function callGemini() {
            const prompt = document.getElementById('promptInput').value;
			const question = prompt;
            const resultDiv = document.getElementById('result');
			let requestPrompt = "";
            
            if (!prompt.trim()) {
                alert("Vui lòng nhập nội dung!");
                return;
            } else {
				const queChinh = document.getElementById("batquaichinh").innerText.split(" - ");
				const queHo = document.getElementById("batquaiho").innerText.split(" - ");
				const queBien = document.getElementById("batquaibien").innerText.split(" - ");
					

				 requestPrompt = `Lập quẻ Mai Hoa Dịch Số được quẻ Chính ${queChinh[0]} trên ${queChinh[1]} dưới, quẻ Hỗ ${queHo[0]} trên ${queHo[1]} dưới, quẻ Biến ${queBien[0]} trên ${queBien[1]} dưới, Hào Động ${haoDong}. Câu hỏi: ${question}?`;
				
				
			
			}

            resultDiv.innerText = "Đang xử lý...";

            // Thay API Key của anh Boss vào đây
            const apiKey = "AQ.Ab8RN6Jl_V88a5GDAjSyUui_71uO1FOMmcn1IWEKrc-NT8iMSQ"; 
            
            // Endpoint chuẩn của mô hình gemini-3.8-flash
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`;

            const data = {
                contents: [{
                    parts: [{ text: requestPrompt }]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (result.candidates && result.candidates[0].content.parts[0].text) {
                    resultDiv.innerText = result.candidates[0].content.parts[0].text;
                } else {
                    resultDiv.innerText = "Lỗi phản hồi: " + JSON.stringify(result, null, 2);
                }
            } catch (error) {
                resultDiv.innerText = "Đã xảy ra lỗi kết nối: " + error.message;
            }
        }
