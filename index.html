 function getCurrentDate() {
    const today = new Date();

    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');

    return `${year}-${month}-${day}`;
}

function saveApiKey() {
        const keyInput = document.getElementById('apiKeyInput').value.trim();

            return;
        }

        // Lưu vĩnh viễn vào bộ nhớ trình duyệt Safari trên iPhone
        localStorage.setItem('MY_GEMINI_API_KEY', keyInput);
        
        statusDiv.innerText = 'Đã lưu thành công trên thiết bị!';
        setTimeout(() => { statusDiv.innerText = ''; }, 3000);
